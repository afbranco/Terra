<!DOCTYPE html>
<html lang="en">
{% include header.html %}
<style>
  .terra-doc table { border-collapse: collapse; margin: 0.5em 0 1.5em; width: 100%; }
  .terra-doc th, .terra-doc td { border: 1px solid #ddd; padding: 4px 8px; vertical-align: top; }
  .terra-doc th { background: #f5f5f5; }
  .terra-doc code { white-space: nowrap; }
  .terra-doc td code { white-space: normal; }
  .terra-doc pre code { white-space: pre; }
  .terra-doc h2 { margin-top: 1.5em; }
</style>
<div class="terra-doc">
{{ content }}
</div>
<script>
  // Links para fora do site abrem em aba nova (pedido do Prof.); os internos ficam na mesma aba.
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (a.host && a.host !== window.location.host) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
</script>
{% include footer.html %}
</html>
